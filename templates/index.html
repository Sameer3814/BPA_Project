<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Property Tax Class Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem 3rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 500px;
        }
        .container img {
            width: 500px;
            display: block;
            margin: 0 auto 20px auto;
            border-radius: 8px;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 20px;
            font-weight: 800;
        }
        select, input[type="file"] {
            margin: 15px 0;
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }
        button {
            margin-top: 20px;
            width: 100%;
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #45a049;
        }
        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="{{ url_for('static', filename='nyc_header.jpg') }}" alt="New York City">
        <h1>NYC Property Tax Class Predictor</h1>
        
        <form action="/" method="POST" enctype="multipart/form-data">
            <select disabled>
                <option>New York City (NYC)</option>
                <option disabled>Cook County (Coming Soon)</option>
                <option disabled>Los Angeles County (Coming Soon)</option>
            </select>
            <input type="file" name="file" required>
            <button type="submit">Predict Tax Class</button>
        </form>

        <div class="footer">
            Made with ❤️ by Your Team
        </div>
    </div>
</body>
</html>
