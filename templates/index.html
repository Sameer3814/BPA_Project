<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NYC Property Tax Class Predictor</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('static/bg-overlay.jpg'); /* Your background image */
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-position: center;
    }

    .container {
      background-color: rgba(253, 244, 227, 0.95); /* Warm beige with slight transparency */
      max-width: 500px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .container img {
      max-width: 100%;
      border-radius: 10px;
    }

    h1 {
      margin: 20px 0 10px;
      font-size: 24px;
      color: #D97904; /* Sunset tone */
    }

    select, input[type="file"] {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background-color: #5ca85c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #4e964e;
    }

    footer {
      margin-top: 20px;
      font-size: 14px;
      color: #444;
    }

    .emoji {
      font-size: 20px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="static/statue.jpg" alt="New York City" style="width: 80%; max-width: 350px; display: block; margin: 10px auto 20px; border-radius: 10px;"/>
    <h1>NYC Property Tax Class Predictor</h1>
    <form method="POST" enctype="multipart/form-data">
      <select name="city">
        <option value="nyc">New York City (NYC)</option>
      </select>
      <input type="file" name="file" accept=".csv" required />
      <button type="submit">Predict Tax Class</button>
    </form>
    <footer>
      Made with <span class="emoji">❤️</span> by Your Team
    </footer>
  </div>
</body>
</html>
